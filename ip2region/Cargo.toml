[package]
name = "ip2region"
version = "0.2.1"
edition = "2024"
rust-version = "1.89.0"
authors = ["Jetsung Chan <i@jetsung.com>"]
description = "The rust binding for ip2region"
license = "Apache-2.0"
repository = "https://github.com/jetsung/shortener"
homepage = "https://github.com/jetsung/shortener"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tracing = "0.1"
thiserror = "2"
bytes = "1"
num-derive = "0.4.2"
num-traits = "0.2.19"
chrono = "0.4"
itertools = "0.14"
clap = { version = "4.5", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[features]
default = []
maker = ["dep:clap", "dep:tracing-subscriber"]

[dev-dependencies]
criterion = "0.7"
rand = "0.9"

[[bench]]
name = "search"
harness = false
