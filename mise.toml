# shortener 开发环境配置（mise）。
# 安装 mise 并在 shell 中激活后，进入仓库目录自动加载本文件。
# 参考 acmecast/mise.toml 的组织方式。

[tools]
# Rust 1.98（与 docker/Dockerfile 的 RUST_VERSION=1.98 对齐）。
# clippy / rustfmt / rust-analyzer 随工具链一起安装。
rust = { version = "1.98", components = ["clippy", "rustfmt", "rust-analyzer"] }

# 前端：Node + pnpm（对应 shortener-frontend/package.json 的 packageManager）。
node = "24"
pnpm = "10.20.0"

# Git 钩子管理器（prek.toml）。
"aqua:j178/prek" = "latest"

[env]
# 本地环境变量：mise 自动加载 .env（KEY=VALUE 格式）。
# 注意：.envrc 是 direnv 脚本，mise 无法解析，不要用它做 _.file。
_.file = ".env"
