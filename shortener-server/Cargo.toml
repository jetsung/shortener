[package]
name = "shortener-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "High-performance URL shortener server"
repository = "https://github.com/jetsung/shortener"
homepage = "https://github.com/jetsung/shortener"
readme = "README.md"

[dependencies]
# Workspace dependencies
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
redis = { workspace = true }
config = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
argon2 = { workspace = true }
jsonwebtoken = { workspace = true }
openidconnect = { workspace = true }
oauth2 = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }

# Local dependencies
shortener-common = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.13"
criterion = "0.7"
tempfile = "3.8"

[[bench]]
name = "code_generation_bench"
harness = false

[[bench]]
name = "url_validation_bench"
harness = false

[[bench]]
name = "database_bench"
harness = false

[[bench]]
name = "cache_bench"
harness = false

[[bench]]
name = "service_bench"
harness = false

[package.metadata.deb]
maintainer = "Jetsung Chan <i@jetsung.com>"
copyright = "2025, Jetsung Chan <i@jetsung.com>"
license-file = ["../LICENSE", "0"]
extended-description = """\
A high-performance URL shortener service written in Rust, \
featuring a RESTful API server and command-line management tool. \
Supports multiple databases (SQLite, PostgreSQL, MySQL), \
Redis/Valkey caching, and GeoIP tracking."""
depends = "$auto, systemd"
section = "web"
priority = "optional"
assets = [
    ["target/release/shortener-server", "usr/local/bin/", "755"],
    ["../config.toml", "opt/shortener/config.toml.example", "644"],
    ["../deploy/systemd/shortener-server.service", "lib/systemd/system/", "644"],
    ["../README.md", "usr/share/doc/shortener-server/", "644"],
]
maintainer-scripts = "../scripts/"
conf-files = ["/opt/shortener/config/config.toml"]

[package.metadata.generate-rpm]
vendor = "Jetsung Chan <i@jetsung.com>"
release = "1"
summary = "High-performance URL shortener service written in Rust"
pre_install_script = "../scripts/preinst"
post_install_script = "../scripts/postinst"
pre_uninstall_script = "../scripts/prerm"
requires = { systemd = "" }

[[package.metadata.generate-rpm.assets]]
source = "target/release/shortener-server"
dest = "/usr/local/bin/shortener-server"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "../config.toml"
dest = "/opt/shortener/config.toml.example"
mode = "644"
config = true

[[package.metadata.generate-rpm.assets]]
source = "../deploy/systemd/shortener-server.service"
dest = "/lib/systemd/system/shortener-server.service"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "../README.md"
dest = "/usr/share/doc/shortener-server/README.md"
mode = "644"
doc = true
