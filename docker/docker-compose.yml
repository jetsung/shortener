# Shortener 统一部署编排：单一镜像、单一进程（shortener-server 直接托管前端静态资源）
# 对外仅暴露 8080 端口：/ 前端页面、/api/*（含健康检查）、/go/{code} 短码跳转
#
# 数据库默认使用 SQLite（./data 目录），可选启用 PostgreSQL / MySQL（profiles）。
services:
  shortener:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: shortener
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=shortener_server=info,sqlx=off
      # WORKDIR 为 /app：相对路径 ./data/... 即 /app/data/...（挂载卷 ../data:/app/data）
      - DATABASE__URL=sqlite://./data/shortener.db?mode=rwc
      - CACHE__ENABLED=true
      - CACHE__URL=redis://redis:6379/0
      - GEOIP__ENABLED=true
      - GEOIP__IP2REGION__PATH=./data/ip2region.xdb
      # PostgreSQL（启用 postgres profile 时改用，替换上面的 DATABASE__URL）：
      # - DATABASE__URL=postgres://shortener:shortener_password@postgres:5432/shortener
    volumes:
      - ../config.toml:/app/config.toml:ro
      - ../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - shortener-network
    healthcheck:
      # distroless 无 shell：借用 redis 镜像同款 busybox 探针不可行，
      # 改由后端 /go/ 探针 + 外部监控；此处用内建 TCP 探测（无 wget）
      # 兼容方案：挂载 busybox 或使用编排层探针，详见 docs/deployment/DOCKER.md
      test: ["NONE"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      disable: true

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: shortener-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - shortener-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # PostgreSQL 数据库（可选：docker compose --profile postgres up）
  postgres:
    image: postgres:16-alpine
    container_name: shortener-postgres
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      - POSTGRES_DB=shortener
      - POSTGRES_USER=shortener
      - POSTGRES_PASSWORD=shortener_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - shortener-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL 数据库（可选：docker compose --profile mysql up）
  mysql:
    image: mysql:8.0
    container_name: shortener-mysql
    restart: unless-stopped
    profiles:
      - mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=shortener
      - MYSQL_USER=shortener
      - MYSQL_PASSWORD=shortener_password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - shortener-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
    driver: local
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  shortener-network:
    driver: bridge
    name: shortener-network
