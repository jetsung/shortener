# Shortener 统一镜像 - Nginx 生产配置
# 职责：
#   1. 前端静态资源托管（hash 模式路由，/#/xxx 在服务端表现为 /；未命中回退 index.html）
#   2. 反向代理 /api/*（含 /api/ping 健康检查）与 /go/ 短码重定向到容器内后端（127.0.0.1:8080）
#
# 支持部署在 TLS 终结反代（外层 nginx / Caddy / 负载均衡）之后：
# 上游传来的 X-Forwarded-Proto / X-Real-IP 原样透传，未携带时回退为本机值，
# 保证后端推导 OIDC 回调地址（redirect_uri）等使用正确的协议与客户端 IP。

# 透传上游协议：有 X-Forwarded-Proto 用上游的，无则回退本机 scheme（http）
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# 透传上游客户端 IP：有 X-Real-IP 用上游的，无则回退直连地址
map $http_x_real_ip $client_real_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}

# WebSocket 连接升级：请求带 Upgrade 头时置 Connection: upgrade，否则置 close
# （避免向普通请求无条件发送 upgrade 头）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 不暴露 nginx 版本号
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（server 级）。
    # 注意：nginx 的 add_header 继承为「全或无」——下方任何 location 内一旦出现
    # add_header（如静态缓存的 Cache-Control），server 级安全头即不再生效，
    # 因此这些 location 内必须重复以下三条（见 /assets/ 与静态文件 location）。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 反向代理公共参数（server 级，/api/ 与 /go/ location 直接继承，无需重复）
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # WebSocket 升级（按需：无 Upgrade 头时 Connection 为 close）
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # 静态文件元数据缓存：减少重复 stat 系统调用
    open_file_cache max=1000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Gzip 压缩（text/html 由 nginx 始终压缩，无需列出）
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 带内容哈希的静态资源（Vite 产物）：长期缓存 + immutable
    # ^~ 确保前缀匹配优先于正则
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header 继承为全或无：此处重复 server 级安全头
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # 其他静态资源：30 天缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        # add_header 继承为全或无：此处重复 server 级安全头
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # 后端 API 反向代理（含 /api/ping 健康检查；代理头已在 server 级统一设置）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # 短码重定向（/go/ 前缀，反代后端做 302；代理头已在 server 级统一设置）
    location /go/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # SPA 回退：未命中文件/目录的路径统一交出入口 HTML（hash 路由下服务端仅 /
    # 会到达这里，兜底覆盖深链与错误路径，状态码 200 使前端路由可接管）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
