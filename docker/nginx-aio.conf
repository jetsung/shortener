# Shortener All-In-One - Nginx 生产配置
# 同时承担：
#   1. 前端静态资源托管（hash 模式路由，/#/xxx 在服务端表现为 /）
#   2. 反向代理 /api/*、/ping 与短码重定向到容器内后端（127.0.0.1:8080）
#
# 本配置支持部署在 TLS 终结反代（外层 nginx / Caddy / 负载均衡）之后：
# 上游传来的 X-Forwarded-Proto / X-Real-IP 原样透传，未携带时回退为本机值，
# 保证后端推导 OIDC 回调地址（redirect_uri）等使用正确的协议与客户端 IP。

# 透传上游协议：有 X-Forwarded-Proto 用上游的，无则回退本机 scheme（http）
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# 透传上游客户端 IP：有 X-Real-IP 用上游的，无则回退直连地址
map $http_x_real_ip $client_real_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # 带内容哈希的静态资源（Vite 产物）：长期缓存
    # ^~ 确保前缀匹配优先于短码正则
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 其他静态资源
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 后端 API 反向代理（WebSocket 升级 + 透传原始 Host）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;

        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $http_host;
    }

    # 健康检查（反代后端 /ping）
    location = /ping {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 短码重定向（1+ 位字母数字，反代后端做 302，支持 WebSocket 升级）
    location ~ "^/[A-Za-z0-9]+$" {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;

        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $http_host;
    }

    # 根路径（hash 模式下 /#/xxx 在服务端均表现为 /）
    location = / {
        try_files $uri /index.html;
    }
}
