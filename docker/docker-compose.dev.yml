services:
  # Shortener Server (Development with SQLite)
  shortener-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: shortener-server-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=debug
      - DATABASE__URL=sqlite:///app/data/shortener.db?mode=rwc
      - CACHE__ENABLED=true
      - CACHE__URL=redis://redis:6379/0
      - GEOIP__ENABLED=true
      - GEOIP__IP2REGION__PATH=/app/data/ip2region.xdb
    volumes:
      - ../config.toml:/app/config.toml:ro
      - ../data:/app/data
      - app-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - shortener-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: shortener-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - shortener-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

volumes:
  redis-data:
    driver: local
  app-logs:
    driver: local

networks:
  shortener-network:
    driver: bridge
