[package]
name = "shortener-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line management tool for the shortener service"
repository = "https://github.com/jetsung/shortener"
homepage = "https://github.com/jetsung/shortener"
readme = "README.md"

[[bin]]
name = "shortener-cli"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
clap = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
config = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
tabled = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
crossterm = { workspace = true }
chrono = { workspace = true }
argon2 = { workspace = true }

# Local dependencies
shortener-common = { workspace = true }
shortener-server = { path = "../shortener-server" }

[package.metadata.deb]
maintainer = "Jetsung Chan <i@jetsung.com>"
copyright = "2025, Jetsung Chan <i@jetsung.com>"
license-file = ["../LICENSE", "0"]
extended-description = """\
Command-line management tool for the Shortener service. \
Create, retrieve, and list shortened URLs; manage the server \
over its RESTful API."""
section = "web"
priority = "optional"
assets = [
    ["target/release/shortener-cli", "usr/local/bin/", "755"],
    ["../README.md", "usr/share/doc/shortener-cli/", "644"],
]

[package.metadata.generate-rpm]
vendor = "Jetsung Chan <i@jetsung.com>"
release = "1"
summary = "Command-line management tool for the Shortener service"

[[package.metadata.generate-rpm.assets]]
source = "target/release/shortener-cli"
dest = "/usr/local/bin/shortener-cli"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "../README.md"
dest = "/usr/share/doc/shortener-cli/README.md"
mode = "644"
doc = true
